<body><main class="shell">
<header class="top"><div><div class="eyebrow">Offline household decision planner</div><h1>Household Finance Planner</h1><p class="sub">Set up your household once, then compare any big decision against it. Estimates only — not tax, legal, or investment advice.</p></div>
<div class="actions"><span class="badge" id="cloudStatus" hidden></span><button class="btn" id="btnCloud" hidden>Sign in to sync</button><button class="btn" id="btnExport">Export backup</button><button class="btn" id="btnImport">Import backup</button><input type="file" id="fileImport" accept=".json,application/json" hidden></div></header>

<script id="engine">
/* ===== Pure calculation + data layer (no DOM). Also exercised by node tests. ===== */
const pmt=(balance,annualRate,termYears)=>{if(!balance)return 0;const r=annualRate/1200,n=termYears*12;return r?balance*r/(1-Math.pow(1+r,-n)):balance/n};
function amort(balance,rate,payment,months){let interest=0,paid=0;for(let i=0;i<months&&balance>1e-7;i++){const due=balance*rate/1200,actual=Math.min(payment,balance+due);interest+=Math.min(due,actual);paid+=actual;balance+=due-actual}return{balance:Math.max(0,balance),interest,paid}}
function mortgageBalance(principal,ratePct,termYears,months){const p=pmt(principal,ratePct,termYears),r=ratePct/1200;if(!principal)return 0;if(!r)return Math.max(0,principal-p*months);return Math.max(0,principal*Math.pow(1+r,months)-p*(Math.pow(1+r,months)-1)/r)}

/* ----- Rental-vs-sell projection (math carried over unchanged from the standalone calculator) ----- */
const REINHART_DEFAULTS={years:20,value:300000,loan:100000,rate:4,payment:800,rent:2000,rentGrowth:2.5,tax:3000,insurance:1200,expenseInflation:2.5,reserve:10,reserveFundsRepairs:true,appreciation:3,basis:200000,depreciation:7000,sellCost:6,deadline:2029,exclusion:500000,brokerStart:100000,brokerReturn:5,fedOrd:25,stateOrd:3.8,gains:15,recapture:25,extraHomeLoan:100000,newRate:6.5,newTerm:30,roofCost:10000,roofYear:5,furnaceCost:6000,furnaceYear:8,vacancy:5,paidMaintenance:0,capitalFunding:2000,stateGain:3.8};
const REINHART_WORKBOOK={rent:2000,tax:3000,depreciation:7000,appreciation:2.5,extraHomeLoan:100000,brokerStart:100000,brokerReturn:7,fedOrd:22,paidMaintenance:2000};
function reinhartRows(s,workbookMode,years){
  const rows=[],growth=1+s.brokerReturn/100,gainRate=(s.gains+s.stateGain)/100,extraMonthly=pmt(s.extraHomeLoan,s.newRate,s.newTerm);
  let reservePool=0,cashBroker=0,cashBasis=0,improvements=0,previousOld={paid:0,interest:0},previousNew={paid:0};
  const n=years==null?Math.max(1,Math.min(30,Math.round(s.years))):years;
  for(let y=1;y<=n;y++){
    const gross=s.rent*12*(1+s.rentGrowth/100)**(y-1),inflation=(1+s.expenseInflation/100)**(y-1);
    const vacancy=gross*s.vacancy/100,allowance=Math.max(0,gross*s.reserve/100-vacancy);
    const funding=workbookMode?s.capitalFunding*inflation:allowance;
    const maintenance=s.paidMaintenance*inflation+(s.reserveFundsRepairs?0:funding);
    const op=(s.tax+s.insurance)*inflation+vacancy+maintenance;
    const repair=(y===Math.round(s.roofYear)?s.roofCost:0)+(y===Math.round(s.furnaceYear)?s.furnaceCost:0);
    improvements+=repair;
    const old=amort(s.loan,s.rate,s.payment,y*12),extra=amort(s.extraHomeLoan,s.newRate,extraMonthly,y*12);
    const reinhPmt=old.paid-previousOld.paid,extraPmt=extra.paid-previousNew.paid;
    const dep=Math.min(s.depreciation,Math.max(0,s.basis-(y-1)*s.depreciation));
    const incomeTax=Math.max(0,gross-op-(old.interest-previousOld.interest)-dep)*(s.fedOrd+s.stateOrd)/100;
    previousOld=old;previousNew=extra;
    const res=s.reserveFundsRepairs?funding:0;reservePool+=res;
    const covered=Math.min(reservePool,repair);reservePool-=covered;
    const net=gross-op-res-reinhPmt-extraPmt-incomeTax-(repair-covered);
    cashBroker=cashBroker*growth+net;cashBasis+=net;
    const property=s.value*(1+s.appreciation/100)**y,proceeds=property*(1-s.sellCost/100);
    const depreciation=Math.min(s.basis,y*s.depreciation);
    const realized=Math.max(0,proceeds-(s.basis+improvements-depreciation));
    const recapture=Math.min(depreciation,realized);
    const exclusion=y<s.deadline-2026?s.exclusion:0; // November anniversaries fall after the September cutoff
    const saleTax=recapture*(s.recapture+s.stateGain)/100+Math.max(0,realized-recapture-exclusion)*(gainRate);
    const rentalTerminal=proceeds-old.balance-extra.balance-saleTax+reservePool+cashBroker-Math.max(0,cashBroker-cashBasis)*gainRate;
    const preTax=s.brokerStart*growth**y,investTerminal=preTax-Math.max(0,preTax-s.brokerStart)*gainRate;
    rows.push({y,gross,op,res,repair,reinhPmt,extraPmt,incomeTax,net,reinhBal:old.balance,extraBal:extra.balance,property,proceeds,saleTax,reservePool,cashBroker,rentalTerminal,investTerminal,diff:rentalTerminal-investTerminal});
  }
  return rows;
}
const reinhartBase=wb=>wb?{...REINHART_DEFAULTS,...REINHART_WORKBOOK}:{...REINHART_DEFAULTS};

/* ----- Household baseline: plain {key: number} values ----- */
// [key, group, label, unit, default, hint]
const BASELINE_DEFS=[
 ['chrisAge','Household','Your age','yr',40,'Timeline starts today at this age'],
 ['annieAge','Household','Partner’s age','yr',40,'Reference only'],
 ['takeHome','Income','Take-home pay (both salaries)','$/yr',100000,'After taxes, payroll and benefits — the money you actually spend from'],
 ['chrisGross','Income','Your gross salary','$/yr',60000,'Only used to weight income growth'],
 ['annieGross','Income','Partner’s gross salary','$/yr',60000,'Includes bonuses; only used to weight income growth'],
 ['chrisGrowth','Income','Your income growth','%/yr',3,''],
 ['annieGrowth','Income','Partner’s income growth','%/yr',3,''],
 ['recurringSpend','Spending','All-in recurring spending','$/yr',72000,''],
 ['spendBasis','Spending','Spending basis used in projections','basis',0,'Two separate bases — never combine them, or spending is counted twice'],
 ['homeTax','Planning reserve','New-home property tax','$/yr',3000,''],
 ['homeIns','Planning reserve','Homeowners insurance','$/yr',0,''],
 ['resUtilities','Planning reserve','New-home utilities (beyond the categories)','$/yr',0,''],
 ['resMaint','Planning reserve','New-home maintenance','$/yr',0,''],
 ['resOther','Planning reserve','Other costs not yet in a category','$/yr',0,''],
 ['oneTimeY1','Spending','One-time first-year spending','$',0,''],
 ['cashReserves','Savings & investments','Cash today','$',20000,''],
 ['reserveTarget','Savings & investments','Cash to keep on hand','$',20000,'Cash above this is invested each year'],
 ['taxableAcct','Savings & investments','Taxable brokerage','$',100000,'Available any time'],
 ['retirementAcct','Savings & investments','Retirement accounts (401k / IRA)','$',100000,'Penalty-free from the access age below'],
 ['contributions','Savings & investments','Annual contributions','$/yr',15000,'A transfer to investments, not spending'],
 ['contribRetShare','Savings & investments','Share going to retirement accounts','%',50,'The rest goes to taxable'],
 ['homeValue','Home & mortgage','New home value','$',350000,''],
 ['homeAppreciation','Home & mortgage','Home appreciation','%/yr',3,''],
 ['newMortgage','Home & mortgage','Mortgage balance','$',250000,''],
 ['mortgagePmt','Home & mortgage','Monthly principal + interest target','$/mo',1500,''],
 ['newMortgageRate','Home & mortgage','Mortgage rate','%',6.5,''],
 ['newMortgageTerm','Home & mortgage','Mortgage term','yr',30,'Principal + interest only; taxes and insurance are separate'],
 ['retireAge','Retirement','Retirement age','yr',60,''],
 ['horizonAge','Retirement','Plan through age','yr',90,''],
 ['retireSpend','Retirement','Retirement spending','$/yr',60000,'Today’s dollars, after income tax'],
 ['ssAmount','Retirement','Your Social Security','$/yr',20000,'Today’s dollars'],
 ['ssAge','Retirement','Social Security starts at','yr',67,''],
 ['workReturn','Retirement','Return while working','%',7,''],
 ['retireReturn','Retirement','Return in retirement','%',5,''],
 ['inflation','Retirement','Inflation','%',2.5,''],
 ['cashReturn','Taxes & account access','Cash return','%',0,''],
 ['accessAge','Taxes & account access','Retirement accounts open penalty-free at','yr',59.5,'Rule of 55 / 72(t) are not modeled'],
 ['earlyPenalty','Taxes & account access','Early-withdrawal penalty','%',10,''],
 ['ordTax','Taxes & account access','Income tax on retirement withdrawals','%',15,'Also applied to the taxable part of Social Security'],
 ['ssTaxable','Taxes & account access','Taxable share of Social Security','%',85,''],
 ['gainTax','Taxes & account access','Tax on investment gains (fed + state)','%',18.8,''],
 ['gainShare','Taxes & account access','Gain share of taxable withdrawals','%',40,'The rest is return of your own money']
];
const SPEND_CATS=[
 ['c_tithing','Charitable giving',100,''],
 ['c_venmo','Shared expenses A',100,''],
 ['c_checks','Shared expenses B',100,''],
 ['c_fuel','Fuel',100,''],
 ['c_phone','Phone',100,''],
 ['c_utilities','Electricity and gas',100,'Direct utility payments, six-month average'],
 ['c_internet','Internet',100,''],
 ['c_tuition','Tuition',100,'Annualized direct payments'],
 ['c_bankfees','Bank fees',100,''],
 ['c_household','Household shopping and supplies',100,'After moving the mixed-store share to groceries / toiletries / cosmetics'],
 ['c_dining','Dining',100,''],
 ['c_cardbills','Card-paid bills and utilities',100,''],
 ['c_transport','Transportation (other than fuel)',100,''],
 ['c_homemaint','Home maintenance and supplies',100,''],
 ['c_entertainment','Entertainment',100,''],
 ['c_personal','Personal and fitness',100,''],
 ['c_education','Education extras',100,'Separate from direct tuition'],
 ['c_travel','Travel reserve',100,''],
 ['c_gifts','Gifts and extra donations reserve',100,''],
 ['c_cardfee','Credit-card annual fee, net of credits',100,''],
 ['c_cash','Cash spending reserve',100,'']
];
const MIX_DEFS=[
 ['groceriesCoded','Groceries (grocery-coded spending)',100,'$/mo','Before the mixed-store share below'],
 ['mixedPool','Mixed-store shopping',50,'$/mo','Shopping pool split into the three shares below'],
 ['mixGroc','Mixed-store share → groceries',85,'%',''],['mixToil','Mixed-store share → toiletries',10,'%',''],['mixCosm','Mixed-store share → cosmetics',5,'%','']];
BASELINE_DEFS.splice(BASELINE_DEFS.findIndex(d=>d[1]==='Savings & investments'),0,
  ...MIX_DEFS.map(([k,l,v,u,hint])=>[k,'Spending detail',l,u,v,hint]),
  ...SPEND_CATS.map(([k,l,v,hint])=>[k,'Spending detail',l,'$/mo',v,hint]));
/* Category cross-check of household spending (monthly inputs -> annual). Does not replace the whole-household estimate unless chosen. */
function spendSummary(v){
  const pool=v.mixedPool,groc=v.groceriesCoded+pool*v.mixGroc/100,toil=pool*v.mixToil/100,cosm=pool*v.mixCosm/100;
  const rows=[['Groceries',groc],['Toiletries',toil],['Cosmetics',cosm],...SPEND_CATS.map(([k,l])=>[l,v[k]])];
  const monthly=rows.reduce((s,r)=>s+r[1],0),travel=v.c_travel,nonHousing=monthly*12,mortgage=12*v.mortgagePmt,alloc=RESERVE_LINES.reduce((s,r)=>s+v[r[0]],0);
  return{rows,monthly,nonHousing,travelAnnual:travel*12,nonHousingExTravel:nonHousing-travel*12,mortgage,ongoing:nonHousing+mortgage,taxIns:alloc,detailed:nonHousing+mortgage+alloc,firstYearDetailed:nonHousing+mortgage+alloc+v.oneTimeY1,whole:v.recurringSpend,gap:v.recurringSpend-(nonHousing+mortgage),reserveLeft:v.recurringSpend-(nonHousing+mortgage+alloc)}
}
/* Planning reserve: the unallocated part of the all-in estimate, drawn down as costs are entered/confirmed. */
function reserveSummary(B){const v=valuesOf(B),s=spendSummary(v),checks=B.checks||{};
  const lines=RESERVE_LINES.map(([k,label,ck])=>({key:k,label,check:ck,amount:v[k],confirmed:ck?!!checks[ck]:false}));
  const confirmed=lines.filter(l=>l.confirmed).reduce((a,l)=>a+l.amount,0),estimated=lines.filter(l=>!l.confirmed).reduce((a,l)=>a+l.amount,0);
  return{start:s.gap,lines,confirmed,estimated,allocated:confirmed+estimated,remaining:s.gap-confirmed-estimated}}
/* Annual spending for projection year t by selected basis. All-in estimate includes property tax/insurance (planning reserve); category build adds them explicitly. */
function annualSpend(v,t){const f=(1+v.inflation/100)**(t-1);
  if(v.spendBasis===1){const s=spendSummary(v);return(s.nonHousing+s.taxIns)*f+(t<=v.newMortgageTerm?s.mortgage:0)}

function paydownBuild(p,wb,v){

    o.lump[yr]=-(price-trade-fin);let prev=0;
    for(let t=1;t<=SERIES;t++){if(t<yr){o.net[t]=-p[pre+'Repairs'];o.equity[t]=trade}else{const a=amort(fin,rate,pay,12*(t-yr+1));o.net[t]=-(a.paid-prev);prev=a.paid;o.equity[t]=price*(1-dep)**(t-yr+1)-a.balance}}
    return o};
  return{H:Math.round(p.years),options:[mk('a','Replace in year '+Math.round(p.aYear)),mk('b','Replace in year '+Math.round(p.bYear))],extra:{}};
}
function customBuild(p,wb,v){

/* ----- Household simulation: monthly cash while working, yearly accounts through the horizon ----- */
function simulate(B,dec){
  const v=valuesOf(B),inf=v.inflation/100,wr=v.workReturn/100,rr=v.retireReturn/100,cr=v.cashReturn/100;

  const share=v.contribRetShare/100,cm=Math.pow(1+cr,1/12),gw=(v.chrisGross+v.annieGross)||1;
  const homeEq=t=>v.homeValue*(1+v.homeAppreciation/100)**t-mortgageBalance(v.newMortgage,v.newMortgageRate,v.newMortgageTerm,12*t);
  const slTaxPending=()=>Math.max(0,sl-d.sleeveBasis)*d.sleeveTax;
  const mk=(t,extra)=>({t,age:v.chrisAge+t,cash,taxable:tx,sleeve:sl,retirement:rt,newHome:homeEq(t),rentalEq:t>0?(d.equity[t]||0):0,nw:cash+tx+sl-slTaxPending()+rt+homeEq(t)+(t>0?(d.equity[t]||0):0),...extra});
  const rows=[mk(0,{phase:'start'})];let low={amount:cash,index:0};
  for(let t=1;t<=endT;t++){
    const age0=v.chrisAge+t-1,f=(1+inf)**(t-1),decNet=d.net[t]||0,lump=d.lump[t]||0,working=t<=retireYrs;
    if(t===retireYrs+1&&sl>0){tx+=sl-slTaxPending();sl=0} // gains on the invested lump are realized when retirement starts
    let r;
    if(working){
      const takeHome=v.takeHome*(v.chrisGross*(1+v.chrisGrowth/100)**(t-1)+v.annieGross*(1+v.annieGrowth/100)**(t-1))/gw,spend=annualSpend(v,t),one=t===1?v.oneTimeY1:0;
      const monthly=(takeHome-spend-v.contributions+decNet)/12;

      rt=rt*(1+wr)+v.contributions*share;tx=tx*(1+wr)+v.contributions*(1-share);sl*=1+d.sleeveRet;
      if(cash>v.reserveTarget){tx+=cash-v.reserveTarget;cash=v.reserveTarget}
      r={phase:'work',income:takeHome,decNet,lump,spending:spend+one,contributions:v.contributions,cashflow:takeHome-spend-one-v.contributions+decNet,baseCashflow:takeHome-spend-one-v.contributions,wCash:0,wTaxable:0,wRetire:0,taxes:0,unfunded:0,need:0,ss:0,real:f};
    }else{

      const tauT=v.gainShare/100*v.gainTax/100,tauR=v.ordTax/100+(penalty?v.earlyPenalty/100:0);
      if(N<=0){cash+=-N;N=0}
      else{
        wCash=Math.min(cash,N);cash-=wCash;N-=wCash;
        if(N>1e-6&&tx>0){const g=Math.min(tx,N/(1-tauT));tx-=g;N-=g*(1-tauT);wTx=g;taxes+=g*tauT}
        if(N>1e-6&&rt>0){const g=Math.min(rt,N/(1-tauR));rt-=g;N-=g*(1-tauR);wRt=g;taxes+=g*tauR}
      }

}
const monthLabel=idx=>{if(idx<=0)return'today';const d=new Date(2026,10+idx-1,1);return d.toLocaleString('en-US',{month:'short',year:'numeric'})};
function metrics(sim,H){

  return{monthlyY1:y1.cashflow/12,monthlyBaseY1:y1.baseCashflow/12,monthlyDecY1:y1.decNet/12,
    lowCash:sim.low.amount,lowCashWhen:monthLabel(sim.low.index),
    accessibleAtRetire:ret.cash+ret.taxable+ret.sleeve,retirementAtRetire:ret.retirement,homeAtRetire:ret.newHome+ret.rentalEq,

/* ----- Plan comparison + decision-readiness ----- */
const fmtMoney=x=>(x<0?'−$':'$')+Math.round(Math.abs(x)).toLocaleString('en-US');
function fmtVal(unit,x){if(unit==='basis')return x===1?'Detailed category build':'All-in estimate';if(unit==='%'||unit==='%/yr')return x+'%';if(unit==='yr')return String(x);return fmtMoney(x)+(unit==='$/yr'?'/yr':unit==='$/mo'?'/mo':'')}

function healthCheck(B,runs){
  const v=valuesOf(B),blocking=[],fixes=[],helps=[];runs=runs&&runs.length?runs:[{name:'',sim:simulate(B,null)}];
  for(const{name,sim}of runs){const m=metrics(sim,20),tag=name&&runs.length>1?name+': ':'';
    if(sim.low.amount<0)blocking.push(tag+'cash goes negative (lowest '+fmtMoney(sim.low.amount)+', '+m.lowCashWhen+')');helps[blocking.length-1]='cash';
    if(m.depletionAge){blocking.push(tag+'savings run out at age '+m.depletionAge);helps[blocking.length-1]='run'}}
  if(v.spendBasis===1&&v.homeIns===0){blocking.push('The detailed spending build has no homeowners insurance yet');fixes[blocking.length-1]='[data-k="homeIns"]'};
  if(v.spendBasis!==1){const rs=reserveSummary(B);if(rs.remaining<-0.5)blocking.push('Costs entered in the planning reserve exceed it by '+fmtMoney(-rs.remaining)+' — raise the all-in estimate or trim the reserve items');helps[blocking.length-1]='reserve'}
  const un=CHECKS.filter(([k])=>!(B.checks&&B.checks[k])).map(c=>c[1]);
  if(un.length)blocking.push('Still to confirm: '+un.join('; '));
  return{ready:!blocking.length,blocking,fixes,helps,unconfirmed:CHECKS.filter(([k])=>!(B.checks&&B.checks[k])),changes:planDiffs(B).length};
}
function sensitivity(d,cur){
  const T=TYPES[d.type];if(!T.sens)return null;const B=decisionBaseline(d,cur),defs=decisionDefaults(d,B),state=decisionState(d,B);
  const diffOf=st=>{const r=runDecision({...d,overrides:diffOverrides(st,defs)},cur);return{nw:r.mets[1].terminalNW-r.mets[0].terminalNW,low:r.mets[1].lowCash-r.mets[0].lowCash}};
  const base=diffOf(state),sg=x=>Math.abs(x)<500?0:Math.sign(x);
  const rows=T.sens.map(([keys,label,kind,amt,unit])=>{keys=[].concat(keys);
    const mk=s=>{const st={...state};keys.forEach(k=>{st[k]=kind==='pct'?state[k]*(1+s*amt):state[k]+s*amt});return st};
    const lo=diffOf(mk(-1)),hi=diffOf(mk(1));
    return{label,spec:kind==='pct'?'±'+Math.round(amt*100)+'%':'±'+amt+' '+(unit||''),lo,hi,swing:Math.abs(hi.nw-lo.nw),flips:sg(lo.nw)!==sg(base.nw)||sg(hi.nw)!==sg(base.nw)}});
  rows.sort((a,b)=>b.swing-a.swing);return{base,rows};

/* ----- Decisions + persistence ----- */
const SCHEMA_VERSION=2,APP_ID='household-finance-planner';
const clone=o=>JSON.parse(JSON.stringify(o));
function newDecision(baseline,type,name,id){type=TYPES[type]?type:'reinhart';return{id:id||('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),type,name:name||TYPES[type].label,created:new Date().toISOString(),updated:new Date().toISOString(),workbookMode:false,overrides:{},baselineSnapshot:clone(baseline),useSavedBaseline:false}}
const decisionBaseline=(d,current)=>d.useSavedBaseline?d.baselineSnapshot:current;
const decisionDefaults=(d,B)=>TYPES[d.type].defaults(valuesOf(B),!!d.workbookMode);
const decisionState=(d,B)=>({...decisionDefaults(d,B),...d.overrides});
function diffOverrides(state,defaults){const o={};for(const k in defaults)if(state[k]!==defaults[k])o[k]=state[k];return o}
function runDecision(d,currentBaseline){

function makeBackup(app){return JSON.stringify({app:APP_ID,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),baseline:app.baseline,decisions:app.decisions,activeId:app.activeId},null,2)}
function parseBackup(text){
  let o;try{o=JSON.parse(text)}catch(e){throw new Error('Not valid JSON.')}
  if(!o||o.app!==APP_ID)throw new Error('This file is not a Household Finance Planner backup.');
  if(!Number.isInteger(o.schemaVersion)||o.schemaVersion>SCHEMA_VERSION)throw new Error('Backup was made by a newer version (schema '+o.schemaVersion+').');
  const baseline=normalizeBaseline(o.baseline);
  const decisions=(Array.isArray(o.decisions)?o.decisions:[]).filter(d=>d&&TYPES[d.type]&&typeof d.id==='string').map(d=>{
    const snap=normalizeBaseline(d.baselineSnapshot||baseline),defs=TYPES[d.type].defaults(valuesOf(snap),!!d.workbookMode),ov={};
    if(d.overrides&&typeof d.overrides==='object')for(const k in defs){if(!(k in d.overrides))continue;const x=d.overrides[k];if(typeof defs[k]==='boolean'){if(typeof x==='boolean')ov[k]=x}else if(x!==null&&x!==''&&Number.isFinite(Number(x)))ov[k]=Number(x)}
    return{id:String(d.id).slice(0,40),type:d.type,name:String(d.name||'Decision').slice(0,120),created:String(d.created||''),updated:String(d.updated||''),workbookMode:!!d.workbookMode&&!!TYPES[d.type].presets,overrides:ov,baselineSnapshot:snap,useSavedBaseline:!!d.useSavedBaseline}});
  const activeId=decisions.some(d=>d.id===o.activeId)?o.activeId:(decisions[0]?decisions[0].id:null);
  return{baseline,decisions,activeId};
}
/* Private numbers/labels live in Supabase, not in this file. applyOverlay() swaps them over the neutral sample values. */
function applyOverlay(o){

  for(const[k,v]of Object.entries(o.baseline||{})){const d=B[k];if(!d)continue;if(v.label!=null)d[2]=v.label;if(Number.isFinite(v.value))d[4]=v.value;if(v.hint!=null)d[5]=v.hint}
  for(const[k,v]of Object.entries(o.spend||{})){const d=S[k];if(!d)continue;if(v.label!=null)d[1]=v.label;if(v.hint!=null)d[3]=v.hint}
  for(const[k,v]of Object.entries(o.mix||{})){const d=M[k];if(!d)continue;if(v.label!=null)d[1]=v.label;if(v.hint!=null)d[4]=v.hint}
  for(const[k,v]of Object.entries(o.reserve||{})){const d=R[k];if(d&&v.label!=null)d[1]=v.label}
  for(const[k,v]of Object.entries(o.checks||{})){const d=C[k];if(d&&typeof v==='string')d[1]=v}
  if(o.reinhart)Object.assign(REINHART_DEFAULTS,o.reinhart);
  if(o.workbook)Object.assign(REINHART_WORKBOOK,o.workbook);
}

function setupCanvas(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{ctx,w,h}}

function chartInit(c,spec){CH[c.id]=spec;c.style.touchAction='pan-y';

function drawLines(id,series,colors,fmt,labels,o){o=o||{};const c=document.getElementById(id);if(!c)return;

    const n=series[0].values.length,X=i=>p.l+i*(w-p.l-p.r)/(n-1||1),Y=v=>p.t+(hi-v)*(h-p.t-p.b)/(hi-lo);
    (o.shade||[]).forEach(sh=>{const i0=ageIdx(labels,sh.fromAge),i1=ageIdx(labels,sh.toAge);if(i0<0||i1<0)return;ctx.fillStyle=sh.color||'rgba(255,181,92,.12)';ctx.fillRect(X(i0),p.t,X(i1)-X(i0),h-p.t-p.b);if(sh.label){ctx.font='11px system-ui';ctx.fillStyle='#ffb55c';ctx.fillText(sh.label,X(i0)+4,h-p.b-6)}});

    series.forEach((s,j)=>{ctx.strokeStyle=colors[j];ctx.lineWidth=2.5;ctx.beginPath();s.values.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke()});

function drawStack(id,layers,colors,fmt,labels,o){o=o||{};const c=document.getElementById(id);if(!c)return;

      drawTip(ctx,w,p,x,labels[hov],[...layers.map((l,j)=>({color:colors[j],text:((o.names||[])[j]?o.names[j]+': ':'')+money(l.values[hov])})),{color:'#e8f0fb',text:'Total: '+money(tot[hov])}])}

  const g=draw(-1);chartInit(c,{n:g.n,p:g.p,w:g.w,draw})}
function drawWaterfall(id,steps){const c=document.getElementById(id);if(!c)return;const{ctx,w,h}=setupCanvas(c),p={l:12,r:12,t:22,b:44};
  let run=0;const bars=steps.map(s=>{let from,to;if(s.total){from=0;to=s.value;run=s.value}else{from=run;to=run+s.value;run=to}return{...s,from,to}});
  const vals=bars.flatMap(b=>[b.from,b.to]);let lo=Math.min(0,...vals),hi=Math.max(...vals);const pad=(hi-lo)*.08;hi+=pad;if(lo<0)lo-=pad;

const PAL=['#54a8ff','#4dd4a3','#ffb55c','#b78cff','#ff7892','#4fd1d9','#e6d15c','#8aa0bb'];
function groupSlices(items,minPct){const tot=items.reduce((a,x)=>a+Math.max(0,x.value),0)||1;const big=items.filter(x=>x.value/tot>=minPct),small=items.filter(x=>x.value>0&&x.value/tot<minPct);

function donutPanel(id,title,badge,slices,center,note){slices=slices.filter(x=>x.value>0);const tot=slices.reduce((a,x)=>a+x.value,0)||1;

function drawDonut(id,slices){const c=document.getElementById(id);if(!c)return;slices=slices.filter(x=>x.value>0);const tot=slices.reduce((a,x)=>a+x.value,0),cen=JSON.parse(c.dataset.center||'{}');

const kfmt=v=>(v<0?'−$':'$')+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(1)+'M':Math.round(Math.abs(v)/1000)+'k');

function refreshChanged(){const defs=Object.fromEntries(BASELINE_DEFS.map(d=>[d[0],d]));
  document.querySelectorAll('#view .field').forEach(f=>{const el=f.querySelector('[data-k]');if(!el)return;const d=defs[el.dataset.k];if(!d)return;const now=parseFloat(el.value),chg=Number.isFinite(now)&&Math.abs(now-d[4])>1e-9;
    f.classList.toggle('chg',chg);let pl=f.querySelector('.plan');if(chg){if(!pl){pl=document.createElement('div');pl.className='plan';f.appendChild(pl)}pl.textContent='Reference plan: '+fmtVal(d[3],d[4])}else if(pl)pl.remove()});

/* ---------- shared field component ---------- */
const suffixOf=u=>(u==='%'||u==='%/yr')?'%':(u==='yr'?'yr':'');
function snapField([k,,label,unit,,hint],val){
  if(unit==='basis')return`<div class="field" style="grid-column:1/-1;grid-template-columns:1fr minmax(0,320px)"><label for="b-${k}">${esc(label)}</label><select id="b-${k}" data-k="${k}"><option value="0" ${val===0?'selected':''}>All-in working estimate (taxes and insurance included)</option><option value="1" ${val===1?'selected':''}>Detailed category build (adds property tax + insurance)</option></select><div class="hint">${esc(hint)}</div></div>`;const pre=unit.startsWith('$'),sfx=suffixOf(unit),cl=pre?'inp':'inp sfx';
  return`<div class="field"><label for="b-${k}">${esc(label)}${unit==='$/yr'?' <span class="hint">per year</span>':unit==='$/mo'?' <span class="hint">per month</span>':''}</label><div class="${cl}"><span class="u">${pre?'$':sfx}</span><input id="b-${k}" type="number" step="any" data-k="${k}" value="${val}"></div>${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`}
function paramField([k,l,min,max,step,kind],val){
  if(kind==='bool')return`<label class="switch"><input type="checkbox" data-key="${k}" ${val?'checked':''}> ${esc(l)}</label>`;
  return`<div class="field"><label for="n-${k}">${esc(l)}</label><input id="n-${k}" data-key="${k}" type="number" min="${min}" max="${max}" step="${step}" value="${val}"><input aria-label="Adjust ${esc(l)}" data-key="${k}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}

  <p class="hint" style="margin:10px 0 12px">The all-in estimate already contains this reserve, so entering a cost here moves money from “unallocated” to “allocated”; it does not raise all-in spending. The detailed build adds these costs on top of its categories. Replace estimates with confirmed amounts as bills and quotes arrive, and tick “confirmed”. If allocated costs exceed the reserve, the all-in estimate is too low.</p>`}

  $('#view').innerHTML=h;
  $('#view').oninput=e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const n=parseFloat(e.target.value);if(!Number.isFinite(n))return;app.baseline.values[k]=n;persist();snapOut();refreshChanged()};

  snapOut();refreshChanged();
}
function drawSnapDonuts(){const el=$('#snapDonuts');if(!el)return;const v=valuesOf(app.baseline),ss=spendSummary(v),r=reserveSummary(app.baseline),spend=annualSpend(v,1),left=v.takeHome-spend-v.contributions;
  const alloc=groupSlices([{label:'Spending',value:spend,color:'#ffb55c'},{label:'Investing',value:v.contributions,color:'#b78cff'},{label:'Left over',value:Math.max(0,left),color:'#4dd4a3'}],0);

function drawSnapWaterfall(){const v=valuesOf(app.baseline),gross=v.chrisGross+v.annieGross,spend=annualSpend(v,1),left=v.takeHome-spend-v.contributions;

/* ---------- Decisions ---------- */
const active=()=>app.decisions.find(d=>d.id===app.activeId)||app.decisions[0];
let dstate=null,dres=null;
function viewDecisions(){
  const d=active();app.activeId=d.id;const T=TYPES[d.type];
  const B=decisionBaseline(d,app.baseline);dstate=decisionState(d,B);
  let h=`<div class="decs">${app.decisions.map(x=>`<button class="dec" data-id="${x.id}" aria-pressed="${x.id===d.id}"><span class="nm">${esc(x.name)}</span><small>${esc(TYPES[x.type].label)}</small></button>`).join('')}</div>
  <div class="row"><label>New decision <select id="newType">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${esc(t.label)}</option>`).join('')}</select></label><button class="btn" id="newDec">Add</button><button class="btn" id="dupDec">Duplicate this</button><button class="btn danger" id="delDec">Delete this</button></div>
  <article class="panel" style="margin-bottom:16px"><div class="row" style="margin-bottom:6px"><label>Name <input type="text" id="decName" value="${esc(d.name)}"></label><label><input type="checkbox" id="useSaved" ${d.useSavedBaseline?'checked':''}> Use the snapshot saved with this decision</label><button class="btn" id="refreshSnap">Update saved snapshot to current</button><span class="badge" id="saveStatus">${esc(saveText())}</span></div><div class="hint">${esc(T.blurb)} <span id="baseStatus"></span></div><div class="hint" id="ovrOut" style="margin-top:6px"></div></article>
  <div id="healthBanner"></div><div id="verdict"></div>
  <article class="panel"><h2 id="cmpTitle">Comparison</h2><div class="table-wrap" id="compare"></div><p class="foot">Nominal dollars. Net worth is before income tax on existing retirement and taxable balances; sale and investment-gain taxes on the decision itself are deducted. Negative cash means a transfer from investments would be needed.</p></article>
  <article class="panel" style="margin-top:16px"><h2>Sensitivity <span class="badge">how fragile is the answer?</span></h2><div id="sensOut" class="table-wrap"><span class="hint">Calculating…</span></div></article>
  <div class="charts" style="margin-top:16px"><article class="panel chartbox"><h2>Net worth over time</h2><div class="legend" id="nwLegend"></div><canvas id="nwChart" aria-label="Net worth by option"></canvas></article><article class="panel chartbox"><h2>Liquid savings over time</h2><div class="legend" id="liqLegend"></div><canvas id="liqChart" aria-label="Liquid savings by option"></canvas></article></div>
  <div class="grid" style="margin-top:16px"><aside class="panel assumptions"><h2>Assumptions</h2>${T.presets?'<div class="row"><button class="btn" id="workbook">Load workbook scenario</button></div>':''}<div class="row"><button class="btn" id="reset">Reset to defaults</button></div><p class="hint" id="presetNote"></p><div id="controls"></div></aside><section class="results" id="extras"></section></div>`;
  $('#view').innerHTML=h;
  document.querySelectorAll('.dec').forEach(b=>b.onclick=()=>{app.activeId=b.dataset.id;persist();viewDecisions()});
  $('#newDec').onclick=()=>{const t=$('#newType').value,c=app.decisions.filter(x=>x.type===t).length,n=newDecision(app.baseline,t,TYPES[t].label+(c?' '+(c+1):''));app.decisions.push(n);app.activeId=n.id;persist();viewDecisions()};
  $('#dupDec').onclick=()=>{const n=newDecision(app.baseline,d.type,d.name+' (copy)');Object.assign(n,{workbookMode:d.workbookMode,overrides:{...d.overrides},baselineSnapshot:clone(d.baselineSnapshot),useSavedBaseline:d.useSavedBaseline});app.decisions.push(n);app.activeId=n.id;persist();viewDecisions()};
  $('#delDec').onclick=()=>{if(app.decisions.length<2){alert('Keep at least one decision.');return}if(confirm('Delete “'+d.name+'”?')){app.decisions=app.decisions.filter(x=>x!==d);app.activeId=app.decisions[0].id;persist();viewDecisions()}};
  $('#decName').oninput=e=>{d.name=e.target.value||'Untitled';touch(d);document.querySelector(`.dec[data-id="${d.id}"] .nm`).textContent=d.name};
  $('#useSaved').onchange=e=>{d.useSavedBaseline=e.target.checked;touch(d);viewDecisions()};
  $('#refreshSnap').onclick=()=>{d.baselineSnapshot=clone(app.baseline);touch(d);viewDecisions()};
  if($('#workbook'))$('#workbook').onclick=()=>{d.workbookMode=true;d.overrides={};touch(d);viewDecisions()};
  $('#reset').onclick=()=>{d.workbookMode=false;d.overrides={};touch(d);viewDecisions()};
  renderControls();decisionOut();
}
function touch(d){d.updated=new Date().toISOString();persist()}
function renderControls(){
  const d=active(),T=TYPES[d.type];
  $('#controls').innerHTML=T.groups.map(([name,fields])=>`<section class="section"><h3>${esc(name)}</h3>${fields.map(f=>paramField(f,dstate[f[0]])).join('')}</section>`).join('');
  $('#presetNote').textContent=T.presets?((d.workbookMode?'Workbook preset active. ':'Project defaults active. ')+'The workbook preset uses its own rent, tax, depreciation, brokerage-return and financing figures.'):'Defaults follow your Snapshot; anything you change here is saved with this decision.';
  const defaults=()=>decisionDefaults(d,decisionBaseline(d,app.baseline));
  const apply=(k,val)=>{dstate[k]=val;d.overrides=diffOverrides(dstate,defaults());touch(d);decisionOut()};
  document.querySelectorAll('#controls [data-key]').forEach(el=>{
    if(el.type==='checkbox')el.addEventListener('change',e=>apply(e.target.dataset.key,e.target.checked));
    else el.addEventListener('input',e=>{const k=e.target.dataset.key,n=parseFloat(e.target.value);if(!Number.isFinite(n))return;document.querySelectorAll(`#controls [data-key="${k}"]`).forEach(x=>{if(x!==e.target)x.value=n});apply(k,n)})});
}
function decisionOut(){

   $('#ovrOut').innerHTML=ks.length?'<span style="color:var(--orange)">Changed from this decision’s defaults:</span> '+ks.map(k=>esc(lab[k]||k)+' ('+esc(String(defs[k]))+' → '+esc(String(d.overrides[k]))+')').join('; '):'All assumptions are at their defaults.'}

  $('#cmpTitle').textContent=`${A.name} vs. ${Bo.name}`;
  const row=(label,a,b,fmt)=>`<tr><td>${label}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td class="${cls(b-a)}">${sgn(b-a)}</td></tr>`;
  const txt=(label,a,b)=>`<tr><td class="sub-row">${label}</td><td>${a}</td><td>${b}</td><td></td></tr>`;
  const out=m=>m.depletionAge?`Runs out at ${m.depletionAge}`:`Funded to ${v.horizonAge}`;
  $('#compare').innerHTML=`<table class="t"><thead><tr><th>Measure</th><th>${esc(A.name)}</th><th>${esc(Bo.name)}</th><th>Difference</th></tr></thead><tbody>
   ${row('Monthly cash flow, year 1',mA.monthlyY1,mB.monthlyY1,money)}

  async function pullOverlay(){ // private labels/defaults live in the 'defaults' row; fetched only when signed in
    const {data}=await sb.from('planner_state').select('data').eq('id','defaults').maybeSingle();
    if(!data)return;
    const txt=JSON.stringify(data.data);let old=null;try{old=localStorage.getItem('plannerOverlay')}catch(e){}
    if(txt===old)return;
    applyOverlay(data.data);try{localStorage.setItem('plannerOverlay',txt)}catch(e){}
    if(lastSaved==null){app.baseline=defaultBaseline();const d=newDecision(app.baseline,'reinhart','Rental vs. sell');app.decisions=[d];app.activeId=d.id} // nothing saved locally yet: start from the real defaults
    setTab(app.tab);
  }
  async function pull(){
    await pullOverlay();
    const {data,error}=await sb.from('planner_state').select('data,updated_at').eq('id','household').maybeSingle();
    if(error){say('Cloud error: '+error.message);return}
    if(!data){await push(true);return}
    remoteStamp=data.updated_at;
    let p;try{p=parseBackup(JSON.stringify(data.data))}catch(e){say('Cloud data unreadable: '+e.message);return}
    const same=JSON.stringify(data.data.baseline)===JSON.stringify(app.baseline)&&JSON.stringify(data.data.decisions)===JSON.stringify(app.decisions);
    if(same){say('Synced '+new Date(remoteStamp).toLocaleTimeString());return}
    if(confirm('Cloud copy (saved '+new Date(remoteStamp).toLocaleString()+') differs from this browser.\nOK = load the cloud copy here.\nCancel = keep this browser\'s data and overwrite the cloud.')){
      app.baseline=p.baseline;app.decisions=p.decisions;app.activeId=p.activeId;
      try{localStorage.setItem(STORE_KEY,makeBackup(app))}catch(e){}
      setTab(app.tab);say('Loaded cloud copy')}
    else await push(true);
  }
  async function push(force){
    if(!user||busy)return;busy=true;
    try{
      if(!force&&remoteStamp){ // detect edits made elsewhere since our last pull
        const {data}=await sb.from('planner_state').select('updated_at').eq('id','household').maybeSingle();
        if(data&&data.updated_at!==remoteStamp){say('Cloud changed elsewhere — click “Sync now” to reconcile');busy=false;return}
      }
      const {data,error}=await sb.from('planner_state').upsert({id:'household',data:JSON.parse(makeBackup(app))}).select('updated_at').single();
      if(error)say('Cloud error: '+error.message);else{remoteStamp=data.updated_at;say('Synced '+new Date(remoteStamp).toLocaleTimeString())}
    }catch(e){say('Cloud offline — saved locally')}
    busy=false;
  }
  function refreshUI(){btn.textContent=user?'Sign out ('+user.email+')':'Sign in to sync';
    const p=$('#ghPanel');if(p){p.innerHTML=user?`<p>Signed in as <strong>${esc(user.email)}</strong>. Changes sync to the cloud a moment after you edit.</p><div class="row"><button class="btn" id="cloudNow">Sync now</button><button class="btn" id="cloudOut">Sign out</button></div>`:`<p>Sign in with your email and password to sync across devices.</p><div class="row"><button class="btn primary" id="cloudIn">Sign in…</button></div>`;
      const a=$('#cloudNow'),b=$('#cloudOut'),c=$('#cloudIn');if(a)a.onclick=pull;if(b)b.onclick=()=>sb.auth.signOut();if(c)c.onclick=signIn}}
  function setUser(u){user=u;refreshUI();if(u)pull();else say('')}
  async function signIn(){
    const email=(prompt('Email:')||'').trim().toLowerCase();if(!email)return;
    const password=prompt('Password:')||'';if(!password){say('Sign-in cancelled');return}
    const r=await sb.auth.signInWithPassword({email,password});
    say(r.error?'Sign-in error: '+r.error.message:'');
  }
  btn.onclick=async()=>{if(user)await sb.auth.signOut();else signIn()};
  sb.auth.onAuthStateChange((_e,s)=>{if(_e==='SIGNED_OUT'){try{localStorage.removeItem('plannerOverlay')}catch(e){}}setUser(s&&s.user||null)});
  return {push:()=>{if(!user)return;clearTimeout(timer);timer=setTimeout(()=>push(false),1500)},render:refreshUI};
})();
</script>
</body></html>
